<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>alert(), confirm(), prompt()</title></head>
<body>
<script>
  alert("This is an alert method");
  confirm("Are you okay?");
  prompt("What's your name?");
  prompt("How old are you?", "20");
</script>
</body>
</html>
